<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Thermal Streams banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#081221"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#e8b04b"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/><stop offset="1" stop-color="#2e6da4"/>
    </linearGradient>
    <marker id="tarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e8b04b"/>
    </marker>
    <marker id="carr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4fc3f7"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- counter-flow exchanger schematic -->
  <g transform="translate(80,50)">
    <!-- shell -->
    <rect x="0" y="20" width="440" height="160" rx="14" fill="#0e2440" stroke="#274b6d" stroke-width="2.5"/>
    <!-- tube (hot stream, left to right, falling curve) -->
    <path d="M 10 60 C 150 75, 300 100, 430 130" stroke="url(#hot)" stroke-width="9" fill="none" marker-end="url(#tarr)"/>
    <!-- shell side (cold stream, right to left, rising curve) -->
    <path d="M 430 60 C 300 90, 150 115, 10 145" stroke="url(#cold)" stroke-width="9" fill="none" marker-end="url(#carr)"/>
    <text x="22" y="46" fill="#e8b04b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">T_h,in hot</text>
    <text x="330" y="170" fill="#e8b04b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">T_h,out</text>
    <text x="336" y="46" fill="#7fd1f0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">T_c,in cold</text>
    <text x="18" y="182" fill="#7fd1f0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">T_c,out</text>
    <text x="150" y="105" fill="#9fb8ce" font-family="Consolas, monospace" font-size="16" text-anchor="middle">Q = ε C_min ΔT_in</text>
    <!-- area axis -->
    <line x1="20" y1="215" x2="420" y2="215" stroke="#5b7a99" stroke-width="1.5" marker-end="url(#tarr)"/>
    <text x="195" y="238" fill="#5b7a99" font-family="Segoe UI, Arial, sans-serif" font-size="15">transfer area A → NTU = UA/C_min</text>
  </g>
  <!-- wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="580" y="120" fill="#ffffff" font-size="60" font-weight="800" letter-spacing="1">Thermal <tspan fill="#e8b04b">Streams</tspan></text>
    <text x="582" y="165" fill="#9fb8ce" font-size="22">heat-exchanger rating · eps-NTU · LMTD cross-check</text>
    <text x="582" y="205" fill="#5b7a99" font-family="Consolas, monospace" font-size="16">5 arrangements · 770 tests · analytic profiles</text>
  </g>
</svg>
